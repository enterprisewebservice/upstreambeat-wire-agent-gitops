apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: upstreambeat-wire
  title: "Wire — upstreambeat.ai news desk"
  # Backstage rejects a null description ("/metadata/description must be
  # string"), so an empty form field must still render a real string —
  # fall back to a generated one. default(x, true) treats "" as falsy.
  # dump, because this is a HUMAN sentence landing in YAML. Morgan's own
  # description -- "Every Monday replace my spreadsheet: totals, revenue,
  # stuck orders and top products." -- contains a colon, which unquoted YAML
  # reads as a nested mapping. Every registration of that agent died with a
  # 400 at Register in Catalog, on camera, while agents whose descriptions
  # happened to avoid colons sailed through.
  description: "News reporter for upstreambeat.ai. Sweeps releases, announcements,\nengineering blogs and upstream changes across the Red Hat AI and developer\nbeat. Files only what clears the editorial gate; logs every held sweep."
  links:
    - url: "https://devspaces.apps.salamander.aimlworkbench.com/#https://github.com/enterprisewebservice/upstreambeat-wire-agent-gitops"
      title: "Open in Dev Spaces"
      icon: catalog
      type: devspaces
  annotations:
    argocd/app-name: upstreambeat-wire-agent
    backstage.io/kubernetes-id: upstreambeat-wire
    # v1.6.0 annotations the agentworkstation-binders RHDH plugin
    # reads. agentoffice.ai/agent-kind lights the Bindings card up
    # on this entity (binders plugin's mountPoint condition). The
    # other two tell the binders plugin which AW + namespace the
    # entity is editing (for the 1:1 entity↔AW case, redundant
    # with name; explicit makes future renames safe).
    agentoffice.ai/agent-kind: reporter
    agentoffice.ai/agentworkstation-name: upstreambeat-wire
    agentoffice.ai/namespace: agent-office
  tags:
    - ai
    - agent
    - openclaw
    - reporter
spec:
  type: ai-agent
  lifecycle: production
  owner: user:default/deanpeterson
